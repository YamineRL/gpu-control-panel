name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  headless:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The app checks skip themselves when there is no amdgpu hwmon node,
      # which is the case on a CI runner: charts and rate maths still run.
      - name: Run headless checks
        run: PYTHONPATH=. python tests/test_app.py
